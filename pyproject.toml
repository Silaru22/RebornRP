[project]
name = "reborn-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.30.0",
    "defusedxml>=0.7.1",
    "discord-py>=2.6.4",
    "gitpython>=3.1.45",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "transliterate>=1.10.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-defusedxml>=0.7.0.20250822",
]


[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "pypackages",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 105
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "PGH003","COM812", "RUF001", "RUF002"]

fixable = ["ALL"]
unfixable = []

flake8-quotes.inline-quotes="single"
mccabe.max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]

strict=true
